name: Angular Lint

on:
  push:
    branches: [ developer ]
  pull_request:
    branches: [ developer ]

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout código
      uses: actions/checkout@v3

    - name: Usar Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18.x'  # Puedes cambiar a '18.x' o '20.x' si prefieres

    - name: Instalar dependencias
      run: npm ci

    - name: Ejecutar lint
      run: npm run lint
